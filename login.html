<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./bootstrap.css">
    <title>Cowryrise</title>
</head>
<body class="loginBody">
    <section class="loginSec">
        <div class="loginLogo">
            <img src="./media/cowrylogo.svg" alt="">
        </div>

        <div class="d-flex">
            <div class="jump w-50">
                <h3>Jump right in</h3>
                <h4 class="">Sign in to continue</h4>
                <p>New user? <a href="#">Create Account</a></p>
            </div>

            <div class="w-50 formCon">
                <form action="" class="">
                    <div class="signWith d-flex justify-content-between gap-3">
                        <a href="#">
                            <span>Sign in with Google</span>
                        </a>
                        <a href="#">
                            <span>Sign in with Apple</span>
                        </a>
                    </div>
                    <div class="d-flex gap-2 align-items-center my-3">
                        <hr class="w-100">
                        <span style="font-size: 12px;">or</span>
                        <hr class="w-100">
                    </div>
                    <div>
                        <div class="emailInputContainer my-4">
                            <input type="email" id="emailInput" class="w-100 p-3" placeholder="Email Address">
                            <label for="emailInput">Email Address</label>
                        </div>
                        <div class="emailInputContainer mt-4 mb-2">
                            <input type="password" id="passwordInput" class="w-100 p-3" placeholder="Password">
                            <label for="passwordInput">Password</label>
                        </div>
                    </div>
                    <a href="#" class="forgetPass">Forgot password?</a>
                    <button type="submit" class="w-100 p-2 mt-5">Sign In</button>
                </form>
                <div class="formFooter d-flex justify-content-between mt-4">
                    <p>Trouble signing in? <a href="#">Chat with us</a></p>
                    <p>  Privacy   |  Terms</p>
                </div>
            </div>
        </div>
    
    </section>






    <script src="./bootstrap.bundle.js"></script>
</body>
</html>
